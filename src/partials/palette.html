<dialog class="palette" id="palette" aria-labelledby="palette-title">
  <h2 class="sr-only" id="palette-title">Command palette</h2>
  <div class="palette__search">
    <svg class="palette__search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5L14 14"/></svg>
    <input class="palette__input" id="palette-input" type="text" role="combobox"
           aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list"
           aria-describedby="palette-count"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"
           placeholder="Jump to a section, role, or action…" aria-label="Search commands" />
    <button class="palette__close" type="button" data-palette-close aria-label="Close command palette">
      <kbd>esc</kbd>
    </button>
  </div>
  <div class="palette__list" id="palette-list" role="listbox" aria-label="Commands"></div>
  <div class="palette__empty" data-palette-empty hidden>
    <p class="palette__empty-title">No matches for “<span data-palette-q></span>”</p>
    <p class="palette__empty-hint">Try “boeing”, “kafka”, “theme”, or “resume”.</p>
  </div>
  <div class="palette__foot">
    <p class="palette__count" id="palette-count" aria-live="polite"></p>
    <p class="palette__hints" aria-hidden="true">
      <span class="palette__hint"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
      <span class="palette__hint"><kbd>↵</kbd> Open</span>
      <span class="palette__hint"><kbd>esc</kbd> Close</span>
    </p>
  </div>
</dialog>
